# Diese Datei muss auf GitHub unter .github/workflows/build-windows.yml liegen.
# Sie baut automatisch eine Windows-EXE bei jedem Push.

name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Ruby (required by mruby build)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-sdl2-glm-static-v2
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg and dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg)) {
            git clone https://github.com/Microsoft/vcpkg.git
            .\vcpkg\bootstrap-vcpkg.bat
          }
          .\vcpkg\vcpkg.exe install sdl2:x64-windows-static glm:x64-windows-static

      - name: Build mruby
        shell: pwsh
        run: |
          if (-not (Test-Path third_party/mruby)) {
            git clone --depth 1 https://github.com/mruby/mruby.git third_party/mruby
          }
          cd third_party/mruby
          ruby minirake
          if (-not (Test-Path include/mruby/presym/id.h)) {
            Write-Error "mruby presym headers were not generated. Build failed."
            exit 1
          }

      - name: Generate OpenGL loader (glad)
        shell: pwsh
        run: |
          python -m pip install glad2
          python -m glad --api gl:core=3.3 --out-path third_party/glad_generated c

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DSDL2_ROOT="${{ github.workspace }}/vcpkg/installed/x64-windows-static" `
            -DRPGMAKER3D_ENABLE_RUBY=ON `
            -DRPGMAKER3D_BUILD_PLAYER=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Prepare package
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force assets build/Release/assets
          Copy-Item -Recurse -Force SampleProject build/Release/SampleProject -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force ruby build/Release/ruby -ErrorAction SilentlyContinue

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RPGMaker3D-Windows-x64
          path: |
            build/Release/RPGMaker3D.exe
            build/Release/RPGMaker3D_Player.exe
            build/Release/assets
            build/Release/SampleProject
