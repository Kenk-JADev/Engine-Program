# Diese Datei muss auf GitHub unter .github/workflows/build-windows.yml liegen.
# Baut automatisch Windows EXE - MIT MSVC mruby Build für Ruby Support

name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Ruby (required by mruby build)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup MSVC (für mruby MSVC Build)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-sdl2-glm-static-v5-ruby-msvc
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg and dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg)) {
            git clone https://github.com/Microsoft/vcpkg.git
            .\vcpkg\bootstrap-vcpkg.bat
          }
          .\vcpkg\vcpkg.exe install sdl2:x64-windows-static glm:x64-windows-static

      - name: Build mruby with MSVC (mit Windows Fix)
        shell: pwsh
        run: |
          if (-not (Test-Path third_party/mruby)) {
            git clone --depth 1 https://github.com/mruby/mruby.git third_party/mruby
          }

          # FIX für strndup Konflikt (egal ob GCC oder MSVC)
          $mirbFile = "third_party/mruby/mrbgems/mruby-bin-mirb/tools/mirb/mirb_completion.c"
          if (Test-Path $mirbFile) {
            Write-Host "Patche mruby strndup Konflikt..."
            $content = Get-Content $mirbFile -Raw
            $content = $content -replace '\bstrndup\s*\(const char', 'mirb_strndup(const char'
            $content = $content -replace '\bstrndup\s*\(', 'mirb_strndup('
            Set-Content -Path $mirbFile -Value $content -Encoding UTF8
          }

          Write-Host "MSVC Compiler: $(where.exe cl)"
          $env:CC = "cl"
          $env:CXX = "cl"

          cd third_party/mruby
          try {
            Write-Host "Baue mruby mit MSVC (cl.exe)..."
            ruby minirake
          } catch {
            Write-Host "MSVC Build fehlgeschlagen, versuche nochmal..."
            ruby minirake
          }

          Write-Host "Prüfe mruby libs..."
          Get-ChildItem build/host/lib/ -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }

          $foundLib = $false
          if (Test-Path "build/host/lib/libmruby.a") { $foundLib = $true }
          if (Test-Path "build/host/lib/libmruby.lib") { $foundLib = $true }
          if (Test-Path "build/host/lib/mruby.lib") { $foundLib = $true }

          if (-not $foundLib) {
            Write-Error "FEHLER: Keine mruby lib gefunden"
            exit 1
          }

          $presymId = "build/host/include/mruby/presym/id.h"
          if (Test-Path $presymId) {
            New-Item -ItemType Directory -Path "include/mruby/presym" -Force | Out-Null
            Copy-Item "build/host/include/mruby/presym/id.h" "include/mruby/presym/id.h" -Force -ErrorAction SilentlyContinue
            Copy-Item "build/host/include/mruby/presym/table.h" "include/mruby/presym/table.h" -Force -ErrorAction SilentlyContinue
          } else {
            Write-Error "presym headers fehlen: $presymId"
            exit 1
          }

      - name: Generate OpenGL loader (glad)
        shell: pwsh
        run: |
          python -m pip install glad2
          python -m glad --api gl:core=3.3 --out-path third_party/glad_generated c

      - name: Configure CMake (mit Ruby ON, MSVC mruby)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DSDL2_ROOT="${{ github.workspace }}/vcpkg/installed/x64-windows-static" `
            -DRPGMAKER3D_ENABLE_RUBY=ON `
            -DRPGMAKER3D_BUILD_PLAYER=ON `
            -DRPGMAKER3D_ENABLE_CONSOLE=ON `
            -DMRUBY_ROOT="${{ github.workspace }}/third_party/mruby" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          Write-Host "=== Build mit Ruby ON ==="
          cmake --build build --config Release --parallel --verbose 2>&1 | Tee-Object -FilePath build_first.log
          $firstResult = $LASTEXITCODE
          Get-Content build_first.log | Select-Object -Last 200 | ForEach-Object { Write-Host $_ }
          if ($firstResult -ne 0) {
            Write-Host "Build mit Ruby ON fehlgeschlagen, Fallback OFF..."
            cmake -B build -S . `
              -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static `
              -DSDL2_ROOT="${{ github.workspace }}/vcpkg/installed/x64-windows-static" `
              -DRPGMAKER3D_ENABLE_RUBY=OFF `
              -DRPGMAKER3D_BUILD_PLAYER=ON `
              -DRPGMAKER3D_ENABLE_CONSOLE=ON `
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release --parallel --verbose 2>&1 | Tee-Object -FilePath build_second.log
            Get-Content build_second.log | Select-Object -Last 300 | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) { 
              Write-Host "Auch Fallback OFF fehlgeschlagen!"
              exit 1 
            }
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_first.log
            build_second.log
            build/CMakeFiles/**/*.log
            build/**/*.log

      - name: Prepare package
        shell: pwsh
        run: |
          $out = "build/Release"
          if (Test-Path assets) { Copy-Item -Recurse -Force assets $out/assets }
          if (Test-Path SampleProject) { Copy-Item -Recurse -Force SampleProject $out/SampleProject -ErrorAction SilentlyContinue }
          if (Test-Path ruby) { Copy-Item -Recurse -Force ruby $out/ruby -ErrorAction SilentlyContinue }
          if (Test-Path docs) { Copy-Item -Recurse -Force docs $out/docs -ErrorAction SilentlyContinue }
          if (Test-Path resources/icon.ico) { Copy-Item -Force resources/icon.ico $out/ -ErrorAction SilentlyContinue }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RPGMaker3D-Windows-x64
          path: |
            build/Release/RPGMaker3D.exe
            build/Release/RPGMaker3D_Player.exe
            build/Release/assets
            build/Release/SampleProject
            build/Release/ruby

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path build/Release/* -DestinationPath RPGMaker3D-Windows-x64.zip -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RPGMaker3D-Windows-x64-ZIP
          path: RPGMaker3D-Windows-x64.zip
