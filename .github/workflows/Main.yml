# GitHub Actions Workflow für den Windows-Build mit mruby/MSVC

name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Ruby (required by mruby build)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup MSVC (für mruby MSVC Build)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-sdl2-glm-static-v5-ruby-msvc
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg and dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg)) {
            git clone https://github.com/Microsoft/vcpkg.git
            .\vcpkg\bootstrap-vcpkg.bat
          }
          .\vcpkg\vcpkg.exe install sdl2:x64-windows-static glm:x64-windows-static

      - name: Build mruby with MSVC
        shell: pwsh
        run: |
          # Kein CC/CXX=cl setzen: Das würde mruby fälschlich auf GCC schalten.
          $mrubyTag = "4.0.0"

          if (Test-Path third_party/mruby) {
            Remove-Item -Recurse -Force third_party/mruby
          }

          git clone --branch $mrubyTag --depth 1 https://github.com/mruby/mruby.git third_party/mruby
          if ($LASTEXITCODE -ne 0) {
            throw "mruby $mrubyTag konnte nicht geklont werden."
          }

          Push-Location third_party/mruby
          try {
            $msvcBin = Split-Path -Parent (Get-Command cl.exe -CommandType Application -ErrorAction Stop).Source
            $msvcLinker = Join-Path $msvcBin "link.exe"
            $msvcArchiver = Join-Path $msvcBin "lib.exe"

            if (-not (Test-Path $msvcLinker) -or -not (Test-Path $msvcArchiver)) {
              throw "MSVC Linker oder Archiver fehlt in $msvcBin"
            }

            # Git for Windows kann seinen GNU-Linker vor MSVC im PATH haben.
            $env:PATH = "$msvcBin;$env:PATH"
            $env:LD = "link.exe"
            $env:AR = "lib.exe"

            # Die Engine und x64-windows-static verwenden /MT.
            # mruby muss dieselbe C-Runtime nutzen, sonst entstehen __imp_* Fehler.
            $env:CFLAGS = "/nologo /W3 /MT /O2 /D_CRT_SECURE_NO_WARNINGS /we4013"
            $env:CXXFLAGS = "/nologo /W3 /MT /O2 /D_CRT_SECURE_NO_WARNINGS /EHs"

            Write-Host "MSVC Compiler: $(where.exe cl)"
            Write-Host "MSVC Linker: $((Get-Command link.exe -CommandType Application -ErrorAction Stop).Source)"

            $env:MRUBY_CONFIG = "ci/msvc"
            Write-Host "Baue mruby $mrubyTag mit der offiziellen MSVC-Konfiguration..."

            & ruby minirake 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/mruby_build.log"
            $mrubyExitCode = $LASTEXITCODE

            if ($mrubyExitCode -ne 0) {
              throw "mruby Build fehlgeschlagen (Exit-Code $mrubyExitCode)."
            }

            $requiredFiles = @(
              "build/host/lib/libmruby.lib",
              "build/host/lib/libmruby_core.lib",
              "build/host/include/mruby/presym/id.h",
              "build/host/include/mruby/presym/table.h"
            )

            $missingFiles = $requiredFiles | Where-Object { -not (Test-Path $_) }
            if ($missingFiles) {
              Write-Host "mruby Ausgabe:"
              Get-ChildItem build/host -Recurse -File -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host $_.FullName }

              throw "mruby Build unvollständig. Fehlend: $($missingFiles -join ', ')"
            }

            New-Item -ItemType Directory -Path "include/mruby/presym" -Force | Out-Null
            Copy-Item "build/host/include/mruby/presym/id.h" "include/mruby/presym/id.h" -Force
            Copy-Item "build/host/include/mruby/presym/table.h" "include/mruby/presym/table.h" -Force

            Write-Host "mruby Bibliotheken erfolgreich gebaut:"
            Get-ChildItem build/host/lib/*.lib | ForEach-Object { Write-Host $_.FullName }
          }
          finally {
            Pop-Location
          }

      - name: Generate OpenGL loader (glad)
        shell: pwsh
        run: |
          python -m pip install glad2
          python -m glad --api gl:core=3.3 --out-path third_party/glad_generated c

      - name: Configure CMake (mit Ruby ON, MSVC mruby)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DSDL2_ROOT="${{ github.workspace }}/vcpkg/installed/x64-windows-static" `
            -DRPGMAKER3D_ENABLE_RUBY=ON `
            -DRPGMAKER3D_BUILD_PLAYER=ON `
            -DRPGMAKER3D_ENABLE_CONSOLE=ON `
            -DMRUBY_ROOT="${{ github.workspace }}/third_party/mruby" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          Write-Host "=== Build mit Ruby ON ==="
          cmake --build build --config Release --parallel --verbose 2>&1 | Tee-Object -FilePath build_first.log
          $firstResult = $LASTEXITCODE

          Get-Content build_first.log | Select-Object -Last 200 | ForEach-Object { Write-Host $_ }

          if ($firstResult -ne 0) {
            Write-Host "Build mit Ruby ON fehlgeschlagen, Fallback OFF..."

            cmake -B build -S . `
              -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static `
              -DSDL2_ROOT="${{ github.workspace }}/vcpkg/installed/x64-windows-static" `
              -DRPGMAKER3D_ENABLE_RUBY=OFF `
              -DRPGMAKER3D_BUILD_PLAYER=ON `
              -DRPGMAKER3D_ENABLE_CONSOLE=ON `
              -DCMAKE_BUILD_TYPE=Release

            cmake --build build --config Release --parallel --verbose 2>&1 | Tee-Object -FilePath build_second.log
            Get-Content build_second.log | Select-Object -Last 300 | ForEach-Object { Write-Host $_ }

            if ($LASTEXITCODE -ne 0) {
              Write-Host "Auch Fallback OFF fehlgeschlagen!"
              exit 1
            }
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            mruby_build.log
            build_first.log
            build_second.log
            build/CMakeFiles/**/*.log
            build/**/*.log

      - name: Prepare package
        shell: pwsh
        run: |
          $out = "build/Release"
          if (Test-Path assets) { Copy-Item -Recurse -Force assets $out/assets }
          if (Test-Path SampleProject) { Copy-Item -Recurse -Force SampleProject $out/SampleProject -ErrorAction SilentlyContinue }
          if (Test-Path ruby) { Copy-Item -Recurse -Force ruby $out/ruby -ErrorAction SilentlyContinue }
          if (Test-Path docs) { Copy-Item -Recurse -Force docs $out/docs -ErrorAction SilentlyContinue }
          if (Test-Path resources/icon.ico) { Copy-Item -Force resources/icon.ico $out/ -ErrorAction SilentlyContinue }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RPGMaker3D-Windows-x64
          path: |
            build/Release/RPGMaker3D.exe
            build/Release/RPGMaker3D_Player.exe
            build/Release/assets
            build/Release/SampleProject
            build/Release/ruby

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path build/Release/* -DestinationPath RPGMaker3D-Windows-x64.zip -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RPGMaker3D-Windows-x64-ZIP
          path: RPGMaker3D-Windows-x64.zip
