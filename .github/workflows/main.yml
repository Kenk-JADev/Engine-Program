#V2
name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'f7423ee180c4b7f40d43402c2feb3853811c013e'
          runVcpkgInstall: true

      - name: Install dependencies via vcpkg
        run: |
          ./vcpkg/vcpkg install sdl2:x64-windows-static glm:x64-windows-static

      - name: Generate OpenGL loader (glad)
        run: |
          python -m pip install glad2
          python -m glad --api gl:core=3.3 --out-path third_party/glad_generated c

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Copy assets
        run: |
          Copy-Item -Recurse -Force assets build\Release\assets

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RPGMaker3D-Windows-x64
          path: |
            build/Release/RPGMaker3D.exe
            build/Release/assets
