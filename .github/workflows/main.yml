name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-sdl2-glm-static
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg and dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg)) {
            git clone https://github.com/Microsoft/vcpkg.git
            .\vcpkg\bootstrap-vcpkg.bat
          }
          .\vcpkg\vcpkg.exe install sdl2:x64-windows-static glm:x64-windows-static

      - name: Generate OpenGL loader (glad)
        shell: pwsh
        run: |
          python -m pip install glad2
          python -m glad --api gl:core=3.3 --out-path third_party/glad_generated c

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Copy assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force assets build\Release\assets

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RPGMaker3D-Windows-x64
          path: |
            build/Release/RPGMaker3D.exe
            build/Release/assets
