; RPG Maker 3D ---- Alles custom ----------------------------------------------
; Alle Schalter sind optional; fehlende Werte = eingebauter Standard (die
; Native*-Schalter sind standardmaessig 1 = eingebaute Oberflaeche an).
; Eingebaute Oberflaechen abschalten (0) und durch eigene Ruby-Szenen ersetzen.
[RPG Maker 3D]
NativeTitle=1        ; 0 = kein eingebauter Titel -> Ruby-Hook Game.custom_title
NativeHud=1          ; 0 = HUD beim Start aus (UI.hud_visible= steuert, F9)
NativeGameMenu=1     ; 0 = Esc oeffnet NICHT das eingebaute Spielmenue
NativeBattleMenu=1   ; 0 = kein eingebautes Kampfmenue (Battle-API nutzen)
NativeBattleStatus=1 ; 0 = keine eingebaute Gegner-/Gruppenzeile im Kampf
NativeMessage=1      ; 0 = Standard-Dialoge (Text/Auswahl/Zahl/Name) per
                     ;     Ruby-Hooks Game.on_ui_* (Referenz: scripts/18_System_Message.rb)
XpSceneMode=0        ; 1 = XP-Szenen-Framework ($scene.__engine_frame pro Frame)

; Laufzeit-Optionen (Startwerte; Optionsmenues per Ruby regelbar):
;   Audio.bgm_volume= / Audio.bgs_volume= / Audio.se_volume= / Audio.me_volume=
;   jeweils 0.0..1.0 zur Laufzeit, Graphics.fullscreen= fuer Vollbild.
BgmVolume=100        ; 0..100 Prozent Musik
BgsVolume=100        ; 0..100 Prozent Hintergrundgeraeusche
SeVolume=100         ; 0..100 Prozent Soundeffekte
MeVolume=100         ; 0..100 Prozent Fanfaren (Music Effects)
Fullscreen=0         ; 1 = Player startet im Vollbild (Editor unberuehrt, Alt+Enter geht immer)
